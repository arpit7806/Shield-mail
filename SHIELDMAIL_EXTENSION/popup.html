<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheidmail</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 300px;
      min-height: 200px;
      background: #1e1e2e;
      font-family: 'Google Sans', Arial, sans-serif;
      color: #cdd6f4;
    }

    .header {
      background: #181825;
      padding: 14px 16px;
      border-bottom: 1px solid #313244;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo { font-size: 20px; }

    .header-text h1 {
      font-size: 15px;
      font-weight: 700;
      color: #cdd6f4;
    }

    .header-text p {
      font-size: 11px;
      color: #6c7086;
    }

    .content { padding: 16px; }

    .no-result {
      text-align: center;
      padding: 20px 10px;
      color: #6c7086;
      font-size: 13px;
      line-height: 1.6;
    }

    .no-result .icon { font-size: 32px; margin-bottom: 8px; }

    .result-card {
      background: #181825;
      border: 1px solid #313244;
      border-radius: 10px;
      padding: 14px;
    }

    .score-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .score-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .score-num {
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
    }

    .score-label {
      font-size: 8px;
      color: #6c7086;
      letter-spacing: 1px;
    }

    .score-info h2 {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .score-info p {
      font-size: 11px;
      color: #a6adc8;
      line-height: 1.4;
    }

    .email-subject {
      font-size: 11px;
      color: #6c7086;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #313244;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .open-gmail {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 9px;
      background: #89b4fa20;
      color: #89b4fa;
      border: 1px solid #89b4fa40;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .open-gmail:hover { background: #89b4fa30; }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid #313244;
      font-size: 10px;
      color: #45475a;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-logo">🛡️</span>
    <div class="header-text">
      <h1>Sheidmail</h1>
      <p>AI Email Threat Detector</p>
    </div>
  </div>

  <div class="content" id="content">
    <div class="no-result">
      <div class="icon">📬</div>
      <p>Open an email in Gmail to start threat analysis</p>
    </div>
  </div>

  <div class="footer">Powered by CrewAI + Groq · shieldmail-ai.onrender.com</div>

  <script src="popup.js"></script>
</body>
</html>
